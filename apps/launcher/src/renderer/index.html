<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' nextlevel: data:; media-src 'self' nextlevel:; connect-src 'self' nextlevel:"
    />
    <title>NextLevel</title>
  </head>
  <body style="margin: 0; background: #05070c">
    <div id="root">
      <!-- Static copy of features/boot/Splash.tsx at 0 %, painted before any script runs; React
           replaces it on first render. Inline styles: the CSS arrives with the bundle. -->
      <div
        style="
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 2.5rem;
          background: #05070c;
          color: #fff;
          user-select: none;
          font-family: ui-sans-serif, system-ui, sans-serif;
        "
      >
        <p
          style="
            margin: 0;
            font-size: 3rem;
            line-height: 1;
            font-weight: 900;
            letter-spacing: -0.025em;
          "
        >
          Next<span style="color: #38bdf8">Level</span>
        </p>
        <div style="width: 20rem; max-width: 80vw">
          <div
            style="height: 0.375rem; border-radius: 9999px; background: rgba(255, 255, 255, 0.1)"
          ></div>
          <p
            style="
              margin: 0.75rem 0 0;
              text-align: center;
              font-size: 0.75rem;
              line-height: 1rem;
              text-transform: uppercase;
              letter-spacing: 0.1em;
              color: rgba(255, 255, 255, 0.5);
            "
          >
            &nbsp;
          </p>
        </div>
      </div>
    </div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
