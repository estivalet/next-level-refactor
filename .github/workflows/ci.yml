name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Electron tests drive the Electron binary installed by npm ci; no browser download needed.
      - run: npm run test:e2e
      # Playwright writes a page snapshot per failure; keep it so CI-only failures can be read.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: apps/launcher/test-results
          retention-days: 7
