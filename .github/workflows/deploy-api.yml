name: Deploy API

# D56: written and tested, not used yet (no server is rented; "no spending" rule, 2026-10-30).
# A manual run builds the image (a dry run unless `deploy` is ticked); an `api-v*` tag builds,
# pushes and deploys. Secrets for a real deploy: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY and
# DEPLOY_URL (the public URL, e.g. https://api.example.com)
# (docs/05-operations/deployment-and-operations.md §8).

on:
  push:
    tags: ['api-v*']
  workflow_dispatch:
    inputs:
      deploy:
        description: Push the image and deploy it (off = build only)
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/estivalet/nextlevel-api
      DEPLOY: ${{ github.event_name == 'push' || inputs.deploy }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "version=$(node -p "require('./apps/api/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - if: env.DEPLOY == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.DEPLOY == 'true' }}
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
      # The image starts and answers its health check with this version (no server needed).
      - name: Smoke test the image
        if: env.DEPLOY != 'true'
        run: |
          docker buildx build --load -t nextlevel-api:smoke .
          docker run -d --name smoke -p 4000:4000 \
            -e PUBLIC_URL=http://localhost:4000 -e AUTH_STUB=1 -e NODE_ENV=development \
            -e JWT_SECRET="$(head -c 32 /dev/urandom | base64)" -e ADMIN_EMAILS=owner@example.com \
            -e BILLING_ENABLED=false nextlevel-api:smoke
          for i in $(seq 1 30); do
            curl -fsS http://localhost:4000/v1/health > health.json && break
            sleep 1
          done
          docker logs smoke
          node -e "const h=require('./health.json'); if (h.version !== '${{ steps.version.outputs.version }}' || h.db !== 'ok') { console.error(h); process.exit(1); }"
      - name: Deploy
        if: env.DEPLOY == 'true'
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          install -m 600 /dev/null key && printf '%s\n' "$SSH_KEY" > key
          ssh -i key -o StrictHostKeyChecking=accept-new "$USER@$HOST" \
            "cd /opt/nextlevel && sed -i 's/^NEXTLEVEL_VERSION=.*/NEXTLEVEL_VERSION=$VERSION/' .env && docker compose pull && docker compose up -d"
          rm key
      - name: Check the deployed version
        if: env.DEPLOY == 'true'
        env:
          URL: ${{ secrets.DEPLOY_URL }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "$URL/v1/health" | grep -q "\"version\":\"$VERSION\""; then exit 0; fi
            sleep 5
          done
          echo "The API at $URL doesn't report $VERSION" && exit 1
