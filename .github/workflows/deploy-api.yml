name: Deploy API

# D56: written and tested, not used yet (no server is rented; "no spending" rule, 2026-10-30).
# Every run builds the image and boots it in production mode before anything else: it must
# answer /v1/health with its version. A manual run stops there unless `deploy` is ticked; an
# `api-v*` tag (it must match apps/api/package.json) also pushes and deploys. Secrets for a real
# deploy: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY and DEPLOY_URL (the public URL, e.g.
# https://api.example.com). See docs/05-operations/deployment-and-operations.md §8.

on:
  push:
    tags: ['api-v*']
  workflow_dispatch:
    inputs:
      deploy:
        description: Push the image and deploy it (off = build and smoke test only)
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/estivalet/nextlevel-api
      DEPLOY: ${{ github.event_name == 'push' || inputs.deploy }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "version=$(node -p "require('./apps/api/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: The tag names this version
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$TAG" != "api-v$VERSION" ]; then
            echo "Tag $TAG doesn't match apps/api/package.json ($VERSION)" && exit 1
          fi
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
      # The image boots with a production configuration (dummy Google clients, billing off) and
      # answers its health check with this version — before it can go anywhere.
      - name: Smoke test the image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker run -d --name smoke -p 4000:4000 \
            -e NODE_ENV=production -e PUBLIC_URL=http://localhost:4000 \
            -e JWT_SECRET="$(head -c 32 /dev/urandom | base64)" -e ADMIN_EMAILS=owner@example.com \
            -e GOOGLE_CLIENT_ID_DESKTOP=smoke -e GOOGLE_CLIENT_SECRET_DESKTOP=smoke \
            -e GOOGLE_CLIENT_ID_WEB=smoke -e GOOGLE_CLIENT_SECRET_WEB=smoke \
            -e BILLING_ENABLED=false "$IMAGE:$VERSION"
          for i in $(seq 1 30); do
            curl -fsS http://localhost:4000/v1/health > health.json && break
            sleep 1
          done
          docker logs smoke
          node -e "const h = require('./health.json'); if (h.version !== process.env.VERSION || h.db !== 'ok') { console.error(h); process.exit(1); }"
          docker rm -f smoke
      - if: env.DEPLOY == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the image
        if: env.DEPLOY == 'true'
        run: docker push "$IMAGE:${{ steps.version.outputs.version }}"
      - name: Deploy
        if: env.DEPLOY == 'true'
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          install -m 600 /dev/null key && printf '%s\n' "$SSH_KEY" > key
          trap 'rm -f key' EXIT
          ssh -i key -o StrictHostKeyChecking=accept-new "$USER@$HOST" \
            "cd /opt/nextlevel && sed -i 's/^NEXTLEVEL_VERSION=.*/NEXTLEVEL_VERSION=$VERSION/' .env && docker compose pull && docker compose up -d"
      - name: Check the deployed version
        if: env.DEPLOY == 'true'
        env:
          URL: ${{ secrets.DEPLOY_URL }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "$URL/v1/health" | grep -q "\"version\":\"$VERSION\""; then exit 0; fi
            sleep 5
          done
          echo "The API at $URL doesn't report $VERSION" && exit 1
